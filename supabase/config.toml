# Supabase Local Development Configuration
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.unithery.com"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:5173/auth/confirm",
  "http://localhost:5173/reset-password",
  "http://localhost:5173/login",
  "https://www.unithery.com",
  "https://www.unithery.com/**",
  "https://www.unithery.com/auth/confirm",
  "https://www.unithery.com/reset-password",
  "https://www.unithery.com/login",
  "https://unithery.com",
  "https://unithery.com/**",
  "https://unithery.com/auth/confirm",
  "https://unithery.com/reset-password",
  "https://unithery.com/login",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[functions]
# verify_jwt defaults are handled per-function via CLI flags

[functions.transcribe-copilot-audio]
verify_jwt = false

[functions.preview-invite]
verify_jwt = false

[functions.register-family]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.sync-stripe-subscriptions]
verify_jwt = false

[functions.stripe-test-webhook]
verify_jwt = false

[functions.check-and-send-reminders]
verify_jwt = false

[functions.auth-send-email]
verify_jwt = false
